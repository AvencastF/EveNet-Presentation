<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EveNet Presentations</title>
    <link rel="icon" href="./assets/evenet-logo-gold.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "EveNet Engineered";
        src: url("./assets/EveNet-Engineered.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --bg: #0c0d0f;
        --fg: rgba(240, 241, 243, 0.92);
        --fg-1: rgba(226, 232, 240, 0.82);
        --fg-2: rgba(183, 199, 210, 0.72);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(240, 195, 110, 0.45);
        --amber: #ffbd59;
        --champagne: #fff0ba;
        --rose: #ff91b5;
        --path: rgba(255, 240, 186, 0.78);
        --evenet-flow-duration: 2s;
        --gutter-w: 11.5rem;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: rgba(255, 189, 89, 0.28);
        color: #fff8e8;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        background: #0c0d0f;
      }

      .hero-scene {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .hero-scene canvas {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0.9;
      }

      .hero-shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            #0c0d0f 0%,
            rgba(12, 13, 15, 0.94) 28%,
            rgba(12, 13, 15, 0.55) 48%,
            rgba(12, 13, 15, 0.08) 72%
          ),
          linear-gradient(0deg, rgba(12, 13, 15, 0.88), transparent 22%, transparent 78%, rgba(12, 13, 15, 0.35));
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 40rem;
        padding: clamp(2rem, 6vh, 4.5rem) clamp(1.25rem, 4vw, 3.5rem) 2.25rem;
      }

      .hero-identity {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .hero-emblem {
        width: clamp(48px, 5vw, 64px);
        height: clamp(48px, 5vw, 64px);
        flex: none;
      }

      /* Brand commitment: EveNet Option C animated wordmark (PRODUCT.md). */
      .evenet-wordmark {
        margin: 0;
        font-family: "EveNet Engineered", sans-serif;
        font-weight: 700;
        font-style: normal;
        font-variant: normal;
        font-feature-settings: "liga" 1;
        font-synthesis: none;
        letter-spacing: 0;
        line-height: 1.02;
        background-image: linear-gradient(
          90deg,
          var(--amber) 0%,
          var(--champagne) 32%,
          var(--rose) 68%,
          var(--amber) 100%
        );
        background-size: 200% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: evenet-brand-flow var(--evenet-flow-duration) ease-in-out infinite;
        filter: drop-shadow(0 0 22px rgba(255, 189, 89, 0.14));
      }

      .hero-title {
        font-size: clamp(2.8rem, 7vw, 4.4rem);
      }

      .evenet-wordmark.is-compact {
        font-size: 1.05rem;
        display: inline-block;
        vertical-align: baseline;
      }

      .hero-lead {
        margin: 0.85rem 0 0;
        font-size: clamp(1.15rem, 2.2vw, 1.45rem);
        line-height: 1.35;
        font-weight: 380;
        color: rgba(226, 232, 240, 0.82);
        max-width: 34rem;
      }

      .hero-divider {
        width: min(100%, 28rem);
        height: 2px;
        margin: 1.4rem 0 1.15rem;
        background: linear-gradient(
          90deg,
          rgba(255, 189, 89, 0.7),
          rgba(255, 240, 186, 0.55),
          rgba(255, 145, 181, 0.45),
          transparent
        );
        transform-origin: left center;
      }

      .hero-meta {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        color: rgba(226, 232, 240, 0.72);
      }

      .hero-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 1.6rem;
        padding: 0.85rem 1.25rem;
        border: 1px solid rgba(255, 189, 89, 0.35);
        border-radius: 2px;
        color: var(--champagne);
        font-size: 0.95rem;
        font-weight: 550;
        letter-spacing: 0.02em;
        background: rgba(255, 189, 89, 0.06);
        transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out);
      }

      .hero-cta:hover,
      .hero-cta:focus-visible {
        background: rgba(255, 189, 89, 0.12);
        border-color: rgba(255, 189, 89, 0.65);
        outline: none;
      }

      .hero-cta-arrow {
        display: inline-block;
        transition: transform 200ms var(--ease-out);
      }

      .hero-cta:hover .hero-cta-arrow,
      .hero-cta:focus-visible .hero-cta-arrow {
        transform: translateY(3px);
      }

      @keyframes evenet-brand-flow {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .catalog {
        position: relative;
        z-index: 2;
        background: linear-gradient(180deg, rgba(12, 13, 15, 0.92), var(--bg) 4rem);
        border-top: 1px solid var(--line);
      }

      .index {
        display: grid;
        grid-template-columns: var(--gutter-w) 1fr;
        gap: 0;
        position: relative;
        min-height: 70vh;
      }

      .gutter {
        position: sticky;
        top: 0;
        align-self: start;
        padding: 1.5rem 0.85rem 2rem clamp(1.1rem, 3vw, 2.4rem);
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        border-right: 1px solid var(--line);
        min-height: 70vh;
        background: rgba(12, 13, 15, 0.72);
        backdrop-filter: blur(8px);
      }

      .tag {
        display: grid;
        grid-template-columns: 1.7rem 1fr;
        align-items: baseline;
        gap: 0.55rem;
        width: 100%;
        text-align: left;
        padding: 0.55rem 0.5rem;
        border-radius: 2px;
        color: var(--fg-2);
        transition: color 160ms var(--ease-out), background 160ms var(--ease-out);
      }

      .tag:hover,
      .tag:focus-visible {
        color: var(--fg);
        background: rgba(255, 255, 255, 0.03);
        outline: none;
      }

      .tag:focus-visible {
        box-shadow: inset 0 0 0 1px rgba(255, 189, 89, 0.55);
      }

      .tag-step {
        font-variant-numeric: tabular-nums;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        color: rgba(183, 199, 210, 0.55);
      }

      .tag-name {
        font-size: 0.95rem;
        font-weight: 500;
      }

      .tag.is-live {
        color: var(--champagne);
      }

      .tag.is-live .tag-step {
        color: var(--amber);
      }

      .tag.is-live .tag-name {
        font-weight: 650;
      }

      .connective {
        position: absolute;
        left: calc(var(--gutter-w) - 1px);
        top: 0;
        width: 2px;
        height: 0;
        background: linear-gradient(180deg, var(--amber), rgba(255, 189, 89, 0));
        opacity: 0;
        pointer-events: none;
        z-index: 5;
        transform-origin: top center;
      }

      .stack {
        padding: 1.35rem clamp(1.1rem, 3vw, 2.4rem) 3.5rem 1.25rem;
      }

      .stack-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.35rem 0 0.85rem;
        border-bottom: 1px solid var(--line);
        margin-bottom: 0.15rem;
      }

      .stack-count {
        margin: 0;
        font-size: 0.86rem;
        color: var(--fg-2);
        font-variant-numeric: tabular-nums;
      }

      .stack-landmark {
        margin: 0;
        font-size: 0.86rem;
        color: var(--fg-2);
      }

      .strip {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(9.5rem, 12rem) minmax(9rem, 11rem);
        gap: 0.85rem 1.1rem;
        align-items: center;
        padding: 0.95rem 0.5rem;
        border-bottom: 1px solid var(--line);
        color: inherit;
        transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out);
      }

      .strip:hover,
      .strip:focus-visible {
        background: rgba(255, 189, 89, 0.035);
        border-bottom-color: var(--line-strong);
        outline: none;
      }

      .strip:focus-visible {
        box-shadow: inset 0 0 0 1px rgba(255, 189, 89, 0.45);
      }

      .strip-title {
        margin: 0;
        font-size: 1.02rem;
        line-height: 1.35;
        font-weight: 550;
        letter-spacing: -0.01em;
        color: var(--fg);
      }

      .strip-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .strip-tag {
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 240, 186, 0.72);
        border: 1px solid rgba(255, 189, 89, 0.22);
        padding: 0.4rem 0.65rem;
        border-radius: 2px;
      }

      .strip-path {
        margin: 0;
        justify-self: end;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.78rem;
        color: var(--path);
        white-space: nowrap;
      }

      .empty {
        padding: 2.5rem 0.5rem;
        color: var(--fg-2);
        font-size: 0.95rem;
      }

      .enter-hide {
        opacity: 0;
        transform: translateY(22px);
      }

      @media (max-width: 820px) {
        :root {
          --gutter-w: 100%;
        }

        .hero-shade {
          background:
            linear-gradient(180deg, rgba(12, 13, 15, 0.55) 0%, rgba(12, 13, 15, 0.82) 48%, #0c0d0f 100%),
            linear-gradient(90deg, rgba(12, 13, 15, 0.75), rgba(12, 13, 15, 0.2));
        }

        .index {
          grid-template-columns: 1fr;
        }

        .gutter {
          position: static;
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 1rem;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          gap: 0.35rem 0.5rem;
        }

        .tag {
          width: auto;
          grid-template-columns: auto auto;
          padding: 0.5rem 0.75rem;
          border: 1px solid var(--line);
        }

        .tag.is-live {
          border-color: rgba(255, 189, 89, 0.45);
          background: rgba(255, 189, 89, 0.08);
        }

        .connective {
          display: none;
        }

        .stack {
          padding-left: clamp(1.1rem, 3vw, 2.4rem);
        }

        .strip {
          grid-template-columns: 1fr;
          gap: 0.45rem;
        }

        .strip-path {
          justify-self: start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .evenet-wordmark {
          animation: none;
        }

        .enter-hide {
          opacity: 1;
          transform: none;
        }

        .hero-scene canvas {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero" aria-label="EveNet introduction">
      <div class="hero-scene" aria-hidden="true">
        <canvas id="foundation-canvas"></canvas>
        <div class="hero-shade"></div>
      </div>

      <div class="hero-copy">
        <div class="hero-identity enter-hide" data-enter="hero">
          <img class="hero-emblem" src="./assets/evenet-logo-gold.svg" width="64" height="64" alt="" />
          <h1 class="evenet-wordmark hero-title">EveNet</h1>
        </div>
        <p class="hero-lead enter-hide" data-enter="hero">
          From event understanding to invisible-particle reconstruction
        </p>
        <div class="hero-divider enter-hide" data-enter="hero" aria-hidden="true"></div>
        <p class="hero-meta enter-hide" data-enter="hero">Presentations · seminars, workshops, and conferences</p>
        <a class="hero-cta enter-hide" data-enter="hero" href="#talks">
          Browse talks
          <span class="hero-cta-arrow" aria-hidden="true">↓</span>
        </a>
      </div>
    </section>

    <div class="catalog" id="talks">
      <div class="index">
        <aside class="gutter enter-hide" data-enter="catalog" aria-label="Filter talks by venue tag"></aside>
        <div class="connective" id="connective" aria-hidden="true"></div>
        <section class="stack" aria-label="Talks">
          <div class="stack-head enter-hide" data-enter="catalog">
            <p class="stack-count" id="stack-count">0 talks</p>
            <p class="stack-landmark">
              <span class="evenet-wordmark is-compact">EveNet</span> · presentations
            </p>
          </div>
          <div id="talk-list"></div>
        </section>
      </div>
    </div>

    <script src="./assets/anime.umd.min.js"></script>
    <script src="./assets/foundation-scene.js"></script>
    <script>
      const talks = [
        {
          title: "NJU Seminar — Event Understanding and Invisible-Particle Reconstruction",
          path: "/NJU_Seminar/",
          href: "./NJU_Seminar/",
          tags: ["Seminar", "NJU"],
        },
        {
          title: "AI@LHC 2026 — Foundation Models for High Energy Physics",
          path: "/AI_LHC_2026/",
          href: "./AI_LHC_2026/",
          tags: ["Workshop", "AI@LHC"],
        },
        {
          title: "AI+HEP Japan — Foundation Models for High Energy Physics",
          path: "/AI_HEP_Japan/",
          href: "./AI_HEP_Japan/",
          tags: ["Workshop", "AI+HEP Japan"],
        },
        {
          title: "EPE Seminar — EPE Weekly",
          path: "/EPE_Seminar/",
          href: "./EPE_Seminar/",
          tags: ["Seminar", "EPE"],
        },
        {
          title: "HWW QE — lvlv",
          path: "/HWW_QE_lvlv/",
          href: "./HWW_QE_lvlv/",
          tags: ["Seminar", "HWW"],
        },
        {
          title: "ICHEP 2027 @ Natal, Brazil — Foundation Models for HEP",
          path: "/ICHEP2027/",
          href: "./ICHEP2027/",
          tags: ["Conference", "ICHEP"],
        },
      ]

      const typeOrder = ["Seminar", "Conference", "Workshop"]
      const venueTags = [...new Set(talks.flatMap((t) => t.tags.filter((tag) => !typeOrder.includes(tag))))]
      const filterTags = ["All", ...typeOrder, ...venueTags]

      const gutter = document.querySelector(".gutter")
      const list = document.getElementById("talk-list")
      const countEl = document.getElementById("stack-count")
      const connective = document.getElementById("connective")
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches

      let liveTag = "All"
      createFoundationScene(document.getElementById("foundation-canvas"))

      function pad(n) {
        return String(n).padStart(2, "0")
      }

      filterTags.forEach((tag, i) => {
        const btn = document.createElement("button")
        btn.type = "button"
        btn.className = "tag" + (tag === "All" ? " is-live" : "")
        btn.dataset.tag = tag
        btn.setAttribute("aria-pressed", tag === "All" ? "true" : "false")
        btn.innerHTML =
          '<span class="tag-step">' + pad(i) + '</span><span class="tag-name">' + tag + "</span>"
        btn.addEventListener("click", () => setFilter(tag, btn))
        gutter.appendChild(btn)
      })

      function filteredTalks() {
        if (liveTag === "All") return talks
        return talks.filter((t) => t.tags.includes(liveTag))
      }

      function renderTalks() {
        const rows = filteredTalks()
        countEl.textContent = rows.length + (rows.length === 1 ? " talk" : " talks")
        if (!rows.length) {
          list.innerHTML = '<p class="empty">No talks match this tag.</p>'
          return
        }
        list.innerHTML = rows
          .map(
            (talk) =>
              '<a class="strip" href="' +
              talk.href +
              '">' +
              '<p class="strip-title">' +
              talk.title +
              "</p>" +
              '<ul class="strip-tags">' +
              talk.tags.map((tag) => '<li class="strip-tag">' + tag + "</li>").join("") +
              "</ul>" +
              '<p class="strip-path"><code>' +
              talk.path +
              "</code></p>" +
              "</a>"
          )
          .join("")
      }

      function pulseConnective(fromBtn) {
        if (reduced || !fromBtn) return
        const btnBox = fromBtn.getBoundingClientRect()
        const indexBox = document.querySelector(".index").getBoundingClientRect()
        const top = btnBox.top - indexBox.top + btnBox.height / 2
        connective.style.top = top + "px"
        connective.style.height = Math.max(48, indexBox.height - top - 24) + "px"
        if (window.anime && window.anime.animate) {
          window.anime.set(connective, { opacity: 0, scaleY: 0.2 })
          window.anime.animate(connective, {
            opacity: [0, 0.9, 0],
            scaleY: [0.2, 1],
            duration: 700,
            ease: "outExpo",
          })
        }
      }

      function setFilter(tag, btn) {
        liveTag = tag
        gutter.querySelectorAll(".tag").forEach((el) => {
          const on = el.dataset.tag === tag
          el.classList.toggle("is-live", on)
          el.setAttribute("aria-pressed", on ? "true" : "false")
        })
        renderTalks()
        pulseConnective(btn)
        if (!reduced && window.anime && window.anime.animate) {
          window.anime.animate(list.querySelectorAll(".strip"), {
            opacity: [0, 1],
            translateY: [10, 0],
            delay: window.anime.stagger(28),
            duration: 420,
            ease: "outQuad",
          })
        }
      }

      function enter() {
        renderTalks()
        const heroNodes = document.querySelectorAll('[data-enter="hero"]')
        const catalogNodes = document.querySelectorAll('[data-enter="catalog"]')
        if (reduced || !(window.anime && window.anime.animate)) {
          document.querySelectorAll(".enter-hide").forEach((el) => el.classList.remove("enter-hide"))
          return
        }
        window.anime.animate(heroNodes, {
          opacity: [0, 1],
          translateY: [28, 0],
          delay: window.anime.stagger(90, { start: 120 }),
          duration: 900,
          ease: "outExpo",
          onComplete: () => heroNodes.forEach((el) => el.classList.remove("enter-hide")),
        })
        window.anime.animate(document.querySelector(".hero-divider"), {
          scaleX: [0, 1],
          duration: 1100,
          delay: 280,
          ease: "outExpo",
        })
        window.anime.animate(catalogNodes, {
          opacity: [0, 1],
          translateY: [18, 0],
          delay: window.anime.stagger(40, { start: 500 }),
          duration: 700,
          ease: "outExpo",
          onComplete: () => catalogNodes.forEach((el) => el.classList.remove("enter-hide")),
        })
      }

      enter()
    </script>
  </body>
</html>
